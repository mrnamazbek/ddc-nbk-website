<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DDC — Центр цифрового развития НБК">
  <!-- Forest-green disc -->
  <circle cx="100" cy="100" r="100" fill="#2C6E54" />

  <g fill="#FFFFFF">
    <!-- Outermost plain capsules -->
    <rect x="15" y="70" width="6" height="60" rx="3" />
    <rect x="179" y="70" width="6" height="60" rx="3" />

    <!-- Second ring: bar + small diamond node -->
    <rect x="37" y="52" width="6" height="96" rx="3" />
    <path d="M40 92 L47.5 100 L40 108 L32.5 100 Z" />
    <rect x="157" y="52" width="6" height="96" rx="3" />
    <path d="M160 92 L167.5 100 L160 108 L152.5 100 Z" />

    <!-- Third ring: taller bar + larger diamond node -->
    <rect x="58.5" y="36" width="7" height="128" rx="3.5" />
    <path d="M62 90 L71 100 L62 110 L53 100 Z" />
    <rect x="134.5" y="36" width="7" height="128" rx="3.5" />
    <path d="M138 90 L147 100 L138 110 L129 100 Z" />

    <!-- Innermost tall bars -->
    <rect x="79.5" y="22" width="9" height="156" rx="4.5" />
    <rect x="111.5" y="22" width="9" height="156" rx="4.5" />

    <!-- Center: crossed shanyrak poles (X) behind a square crown -->
    <rect x="98" y="77" width="4" height="46" rx="2" transform="rotate(45 100 100)" />
    <rect x="98" y="77" width="4" height="46" rx="2" transform="rotate(-45 100 100)" />
    <rect x="92" y="92" width="16" height="16" rx="2" fill="#2C6E54" stroke="#FFFFFF" stroke-width="4" />
  </g>
</svg>
